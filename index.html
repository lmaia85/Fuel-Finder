<!doctype html>
<!--
  Fuel Finder - endurance fuel reviews. Single-page app: no build, no network
  beyond Google Fonts and the one product photo being viewed.

  Structure
    PRODUCTS[]  one record per product (in fuelcheck-products.js). Everything
                else builds itself from this.
    derive()    computes cost/gram, sachets/hr, race cost. Never type these.
    table()     the comparison. Row = [label, format, sortKey, hi|lo, definition].
    render(p)   paints the page for one product.
    routing     #category/product-id is a review permalink (Back/Forward work);
                #requests is the owner view; no hash is the landing page.

  Adding a product = adding a record to PRODUCTS. The brand menu, the search,
  the best/worst colouring and the comparison all pick it up automatically.
  Nothing in the catalog requires human judgement — gut comfort (`p.gut`,
  gels only) is computed from ingredient count same as everything else; see
  ingredientGutScore().

  Product photos live in Product Photos/ and are referenced by path in the
  catalog. The hero stage displays them at ~320px wide, so keep source files
  around 640px on the long edge — don't embed them as base64, that once made
  this catalog 22 MB.

  Unreferenced but retained: CAPS, rank(), field(), and the per-product
  carbNote / sodiumNote / cafNote strings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel Finder — Endurance nutrition reviews</title>
<meta name="description" content="Gel, drink mix and electrolyte reviews built from declared nutrition panels — cost per gram, sodium and absorption rate compared across every product, not marketing copy.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fuel Finder">
<meta property="og:title" content="Fuel Finder — Endurance nutrition reviews">
<meta property="og:description" content="Gel, drink mix and electrolyte reviews built from declared nutrition panels — cost per gram, sodium and absorption rate compared across every product, not marketing copy.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Fuel Finder — Endurance nutrition reviews">
<meta name="twitter:description" content="Gel, drink mix and electrolyte reviews built from declared nutrition panels, not marketing copy.">
<!-- WebSite JSON-LD: add "url" once the site has a real deployed address -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Fuel Finder",
  "description": "Gel, drink mix and electrolyte reviews built from declared nutrition panels, not marketing copy."
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#07090C; --panel:#0C1015; --sunk:#04060899;
  --rule:#171E26; --rule-2:#232D38;
  --ink:#E8EEF1; --dim:#8C99A3; --faint:#59646E;
  --me:#3BD0EC; --best:#A9D62B; --worst:#F0576E; --band:rgba(59,208,236,.10);
  --display:'Archivo',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--mono);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
/* .toc + .wrap sit as flex siblings, centered as a unit — this keeps the toc
   a real layout column with a guaranteed gap from content at any viewport
   width, instead of a viewport-relative fixed position that has to be
   recalculated (and can drift into content, or off-screen) per breakpoint. */
.layout{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:0 28px}
@media(max-width:800px){.layout{padding:0 16px}}
.wrap{max-width:1180px;width:100%;min-width:0}

/* header */
.bar{border-bottom:1px solid var(--rule-2);position:sticky;top:0;background:var(--ground);z-index:20}
.bar-in{max-width:1180px;margin:0 auto;padding:0 28px;height:52px;display:flex;align-items:center;gap:26px}
.mark{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;
  text-transform:uppercase;color:var(--ink);text-decoration:none}
.mark span{color:var(--me)}
.nav{display:flex;gap:20px;margin-left:auto;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.nav a{color:var(--faint);text-decoration:none;display:block;padding:19px 0}
.nav a.on{color:var(--ink)}

/* two-level menu: Gels > brand > product */
.nv{position:relative}
.dd{display:none;position:absolute;left:-14px;top:100%;min-width:210px;z-index:40;
  background:var(--panel);border:1px solid var(--rule-2);padding:5px 0}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:block}
.br{position:relative}
/* A real button, not a span: the product list below is display:none until the
   brand row is hovered/focused/open, and display:none content is skipped by
   Tab — so a non-focusable toggle would lock keyboard users out of the menus
   entirely. font:inherit keeps it pixel-identical to the old span. */
.br-toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;
  width:100%;appearance:none;background:none;border:0;cursor:pointer;text-align:left;
  font:inherit;padding:8px 14px;color:var(--dim);white-space:nowrap}
.br-toggle i{font-style:normal;color:var(--faint);display:inline-block;transition:transform .15s}
.br:hover > .br-toggle,.br:focus-within > .br-toggle,.br.open > .br-toggle{background:var(--ground);color:var(--ink)}
.br:hover > .br-toggle i,.br.open > .br-toggle i{color:var(--me)}
.br-toggle[aria-expanded="true"] i{transform:rotate(90deg)}
/* .submenu, not .sub — .sub is the section-subtitle <p> further down; sharing
   the name leaked the subtitle's font/margins onto this panel. */
.submenu{display:none;position:absolute;left:100%;top:-6px;min-width:200px;
  background:var(--panel);border:1px solid var(--rule-2);padding:5px 0}
.br:hover .submenu,.br:focus-within .submenu,.br.open .submenu{display:block}
.submenu button{appearance:none;background:none;border:0;cursor:pointer;width:100%;text-align:left;
  padding:8px 14px;color:var(--dim);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.submenu button em{font-style:normal;color:var(--faint);font-size:10px;letter-spacing:.04em}
.submenu button:hover{background:var(--ground);color:var(--ink)}
.submenu button:hover em{color:var(--me)}
.submenu button[aria-current="true"]{color:var(--me)}

/* mobile nav: a hamburger-toggled drawer that reuses the exact same
   Gels > brand > product open/aria-expanded state the desktop hover menu
   sets (see the .nv/.dd/.br/.submenu rules above) — only the positioning
   changes here, from an absolute flyout to a stacked accordion. */
.menu-toggle{display:none;appearance:none;background:none;border:1px solid var(--rule-2);
  color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:9px 16px;margin-left:auto}
.menu-toggle:hover{border-color:var(--me);color:var(--me)}
@media(max-width:800px){
  .menu-toggle{display:block}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;margin:0;
    flex-direction:column;align-items:stretch;gap:0;background:var(--panel);
    border-bottom:1px solid var(--rule-2);padding:4px 20px 18px;
    max-height:calc(100vh - 52px);overflow-y:auto;z-index:30}
  .nav.mnav-open{display:flex}
  .nav > *{border-bottom:1px solid var(--rule)}
  .nav > *:last-child{border-bottom:0}
  .nav a{padding:16px 0;font-size:12px}
  .nv > a{display:flex;justify-content:space-between;align-items:center}
  .nv > a::after{content:"\203A";display:inline-block;transform:rotate(90deg);
    color:var(--faint);font-size:13px;transition:transform .15s,color .15s}
  .nv > a[aria-expanded="true"]::after{transform:rotate(-90deg);color:var(--me)}
  .dd{position:static;min-width:0;background:none;border:0;padding:0 0 6px}
  .br-toggle{padding:13px 4px;font-size:12px}
  .submenu{position:static;left:auto;top:auto;min-width:0;
    background:none;border:0;padding:0 0 4px 14px}
  .submenu button{padding:11px 4px;font-size:12.5px}
  .submenu button em{font-size:11px}
}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px;align-items:center;
  padding:44px 0 34px;border-bottom:1px solid var(--rule-2)}
@media(max-width:800px){.hero{grid-template-columns:1fr;gap:26px;padding:28px 0 24px}}
.eye{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--me);margin:0 0 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.6vw,54px);line-height:.98;
  letter-spacing:-.035em;margin:0}
.meta{font-size:11px;letter-spacing:.08em;color:var(--faint);margin:14px 0 0;text-transform:uppercase}
.thesis{font-family:var(--body);font-size:clamp(16px,2vw,19px);line-height:1.5;color:var(--ink);
  margin:22px 0 0;max-width:54ch}
.thesis b{font-weight:500;color:var(--me)}
.score-badge{display:inline-block;vertical-align:middle;font-family:var(--mono);font-weight:600;
  font-size:.3em;letter-spacing:0;padding:.3em .55em;border-radius:7px;margin-left:.3em;
  border:1px solid;line-height:1}
.score-badge.tier-best{color:var(--best);border-color:var(--best);background:rgba(169,214,43,.1)}
.score-badge.tier-mid{color:var(--me);border-color:var(--me);background:var(--band)}
.score-badge.tier-worst{color:var(--worst);border-color:var(--worst);background:rgba(240,87,110,.1)}

/* score breakdown */
.sb{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.sb-tile{padding:26px 24px;display:flex;align-items:center;gap:16px}
.sb-tile.tier-best{background:rgba(169,214,43,.1)}
.sb-tile.tier-mid{background:var(--band)}
.sb-tile.tier-worst{background:rgba(240,87,110,.1)}
.sb-num{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;letter-spacing:-.02em}
.sb-tile.tier-best .sb-num{color:var(--best)}
.sb-tile.tier-mid .sb-num{color:var(--me)}
.sb-tile.tier-worst .sb-num{color:var(--worst)}
.sb-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sb-rows{background:var(--ground);display:flex;flex-direction:column;justify-content:center;flex:1}
.sb-row{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--rule)}
.sb-row:last-child{border-bottom:0}
.sb-row-label{font-family:var(--body);font-size:13px;color:var(--dim)}
.sb-row-score{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}
/* Fixed-height stage so every product (pouch, tube, flat sachet — all different
   native aspect ratios) reads at the same visual size, on a common backdrop
   with one soft contact shadow, rather than each photo floating at its own
   scale straight on the page background. */
.shot-stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center}
.shot-stage::before{content:"";position:absolute;left:50%;bottom:2%;transform:translateX(-50%);
  width:58%;height:18px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 72%)}
@media(max-width:800px){.shot-stage{height:220px}}
.shot{position:relative;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.45))}
.shot-ph{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.shot-ph svg{height:82%;width:auto;display:block;filter:drop-shadow(0 14px 16px rgba(0,0,0,.35))}
.shot-ph span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* score breakdown + headline pair, side by side: breakdown on the left
   (right under the thesis, in reading order), the two headline stats
   stacked in a fixed-width column on the right. */
.sb-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:36px}
@media(max-width:800px){.sb-layout{grid-template-columns:1fr;gap:24px}}
.sb-layout-left{display:flex}
.sb-layout-left .sb{flex:1}
.sb-layout-right{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.sb-layout-right .pcell{flex:1;display:flex;flex-direction:column;justify-content:center}
.pcell{background:var(--ground);padding:26px 30px 28px}
@media(max-width:800px){.pcell{padding:20px 16px}}
.pcell .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.pcell .v{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,54px);
  line-height:1;letter-spacing:-.04em;margin:10px 0 0}
.pcell .v small{font-size:.36em;color:var(--faint);letter-spacing:0;margin-left:3px}
.pcell .v .sep{color:var(--me);margin:0 .05em}

/* section frame */
section{padding:36px 0;border-bottom:1px solid var(--rule)}
.sh{display:flex;align-items:baseline;gap:14px;margin:0 0 4px}
.sh h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;
  text-transform:uppercase;margin:0}
.sh .rule{flex:1;height:1px;background:var(--rule-2)}
.sh .n{font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sub{font-family:var(--body);font-size:13px;color:var(--dim);margin:0 0 26px;max-width:64ch}

/* table */
.tw{overflow-x:auto;border:1px solid var(--rule-2)}
/* table-layout:fixed + explicit col widths (see .labelcol/.gelcol below) so a
   column's width never depends on how many others are in the table — adding
   or removing a gel changes the table's total width, not its neighbors'. */
table{border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.labelcol{width:230px}
.gelcol{width:150px}
.addcol{width:150px}
/* A permanent empty column at the right of the table, not a button off to
   the side — a dashed border runs the full height so it reads as one open
   slot the whole way down, with the actual control sitting in the header. */
.addcol-cell{border-left:1px dashed var(--rule-2);padding:0}
.add-trigger{appearance:none;background:none;border:0;cursor:pointer;width:100%;height:100%;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.add-trigger .plus{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;color:var(--rule-2)}
.add-trigger:hover{color:var(--me)}
.add-trigger:hover .plus{color:var(--me)}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--rule)}
thead th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:500;vertical-align:bottom;border-bottom:1px solid var(--rule-2);background:var(--panel)}
thead th.this{color:var(--me)}
tbody th{font-weight:400;color:var(--dim);white-space:normal;font-size:12px;
  vertical-align:top;padding-top:11px}
.rowlab{display:block;white-space:nowrap;color:var(--ink)}
.rowdef{display:block;font-family:var(--body);font-size:11px;color:var(--faint);
  line-height:1.35;margin-top:3px;max-width:34ch}
td{font-variant-numeric:tabular-nums;color:var(--ink)}
td.this{background:rgba(59,208,236,.07);border-left:1px solid var(--me);border-right:1px solid var(--me)}
tbody tr:last-child td.this{border-bottom:1px solid var(--me)}
.best{color:var(--best)} .worst{color:var(--worst)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}

/* comparison set: full names, removable columns, searchable add */
thead th.pcol{position:relative;white-space:normal;vertical-align:bottom;padding:10px 34px 9px 13px}
.thbrand{display:block;font-size:9px;letter-spacing:.1em;color:var(--faint)}
.thname{display:block;color:var(--dim);font-family:var(--display);font-weight:700;font-size:12.5px;
  letter-spacing:-.01em;text-transform:none;line-height:1.22;margin-top:3px}
thead th.this .thname{color:var(--me)}
/* A real corner button — visible border/background by default, not just on
   hover, with a large enough hit target to find without hunting for it. */
.rm{position:absolute;top:8px;right:8px;appearance:none;cursor:pointer;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule-2);border-radius:5px;background:var(--ground);color:var(--dim);
  font-family:var(--mono);font-size:13px;line-height:1;padding:0;
  transition:background .12s,border-color .12s,color .12s}
.rm:hover{background:var(--worst);border-color:var(--worst);color:#fff}
.rm:disabled{cursor:default;opacity:.3}
.rm:disabled:hover{background:var(--ground);border-color:var(--rule-2);color:var(--dim)}
.sh .n{align-self:center}
.finder{position:relative}
.fpanel[hidden]{display:none}
.fpanel{position:fixed;z-index:50;width:262px;
  background:var(--panel);border:1px solid var(--rule-2);padding:9px}
.fpanel input{width:100%;background:var(--ground);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--mono);font-size:12px;padding:8px 9px;outline:none}
.fpanel input:focus{border-color:var(--me)}
.fres{max-height:212px;overflow:auto;margin-top:7px}
.fres button{display:block;width:100%;text-align:left;appearance:none;background:none;border:0;
  cursor:pointer;padding:7px 9px;color:var(--dim);font-family:var(--body);font-size:12.5px;line-height:1.3}
.fres button:hover{background:var(--ground);color:var(--ink)}
.fres button span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);
  letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.fres p{margin:0;padding:9px;color:var(--faint);font-size:11px;line-height:1.4}

/* pros / cons */
.pc{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
@media(max-width:800px){.pc{grid-template-columns:1fr}}
.pcx{background:var(--ground);padding:22px 24px}
.pcx h3{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;margin:0 0 16px;color:var(--dim)}
.pcx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pcx li{font-family:var(--body);font-size:13px;line-height:1.5;padding-left:20px;position:relative;color:var(--ink)}
.pcx li::before{position:absolute;left:0;top:0;font-family:var(--mono);font-size:12px}
.wy li::before{content:"\2713";color:var(--best)}
.wn li::before{content:"\2715";color:var(--worst)}
.up li::before{content:"+";color:var(--best)}
.dn li::before{content:"\2212";color:var(--worst)}

/* where to buy */
.buy{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.buy-row{background:var(--ground);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;text-decoration:none;color:var(--ink);transition:background .12s}
.buy-row:hover{background:var(--panel)}
.buy-row:hover .buy-go{background:var(--ink);color:var(--me)}
.buy-retailer{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.buy-price{font-family:var(--mono);font-size:15px;color:var(--ink);margin-left:auto}
.buy-price small{font-size:11px;color:var(--faint);margin-left:4px}
.buy-go{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ground);background:var(--me);border-radius:100px;padding:9px 16px;white-space:nowrap;
  transition:background .12s,color .12s}
.buy-empty{font-family:var(--body);font-size:13px;color:var(--faint);padding:18px 22px;border:1px solid var(--rule-2)}
footer{padding:30px 0 70px;color:var(--faint);font-family:var(--body);font-size:12px;line-height:1.6}
footer b{color:var(--dim);font-weight:500}

/* in-page section nav — a real flex column (see .layout above), sticky within
   normal document flow, so it's always exactly `gap` away from content with
   no viewport-relative math to get wrong. Hidden below 1400px, where there
   isn't room for a left column beside the 1180px content anyway. */
.toc{display:none;flex:0 0 auto;max-width:150px;position:sticky;top:96px;
  flex-direction:column;gap:14px}
.toc-head{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:-.01em;
  line-height:1.25;color:var(--ink);padding-bottom:14px;margin-bottom:2px;border-bottom:1px solid var(--rule-2)}
.toc button{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-decoration:none;white-space:nowrap;
  appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.toc button::before{content:"";width:14px;height:1px;background:var(--rule-2);transition:width .15s,background .15s}
.toc button:hover{color:var(--dim)}
.toc button.active{color:var(--me)}
.toc button.active::before{background:var(--me);width:22px}
@media(min-width:1400px){.toc{display:flex}}

/* home / landing page */
.home-hero{padding:56px 0 40px;border-bottom:1px solid var(--rule-2)}
.home-hero h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,60px);
  line-height:.98;letter-spacing:-.035em;margin:0}
.home-hero .thesis{margin:22px 0 0;max-width:60ch}
.home-search{position:relative;margin:28px 0 0;max-width:480px}
.home-search input{width:100%;background:var(--panel);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--mono);font-size:13px;padding:14px 16px;outline:none}

<body>

<header class="bar"><div class="bar-in">
  <a class="mark" href="#" id="home-link">Fuel <span>Finder</span></a>

<script src="fuelcheck-products.js"></script>
<script>

const CATEGORY_LABEL = {gel:"gel", drink:"drink mix", electrolyte:"electrolyte"};
const CATEGORY_PLURAL = {gel:"gels", drink:"drink mixes", electrolyte:"electrolytes"};
/* Past six columns the table gets cramped and hard to actually compare —
   cap it here rather than let it grow unbounded. */
const MAX_COMPARE = 6;

/* Logs searches that didn't match anything in the catalog, so whoever runs
   the site can see what people are actually looking for and go write that
   review next. Backed by localStorage for now — this only sees requests
   made in the same browser, which is fine while the site is local-only.
   When this moves onto a live server, swap the bodies of save()/list()/
   remove()/clear() for real network calls (e.g. POST/GET/DELETE against an
   API) — every caller elsewhere in the file goes through this object, so
   nothing outside these four functions needs to change. */
const RequestLog = (() => {
  const KEY = "fuelfinder_requests";
  const read = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } };
  const write = list => { try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){} };
  return {
    save(query){
      const q = query.trim();
      if(!q) return;
      const list = read();
      const existing = list.find(r => r.query.toLowerCase() === q.toLowerCase());
      const now = new Date().toISOString();
      if(existing){ existing.count++; existing.lastSeen = now; }
      else list.unshift({query: q, count: 1, firstSeen: now, lastSeen: now});
      write(list);
    },
    list(){ return read().sort((a,b) => b.count - a.count || new Date(b.lastSeen) - new Date(a.lastSeen)); },
    remove(query){ write(read().filter(r => r.query !== query)); },
    clear(){ write([]); }
  };
})();

const RANGE = {
  carbs:   {min:20, max:45,  scale:50,  unit:"g",  label:"Carbohydrate"},
  sodium:  {min:0,  max:200, scale:300, unit:"mg", label:"Sodium"},
  caffeine:{min:0,  max:100, scale:200, unit:"mg", label:"Caffeine"}
};

const TARGET_RATE = 90;
const MARATHON_G  = 300;

/* Gels and drink mixes are carb-fuel products, scored by cost per gram of
   carbohydrate. Electrolyte products are near-zero-carb by design — the
   same math would divide by ~0 — so they're scored by cost per 1000mg of
   sodium instead, the number that actually varies between them. */
function derive(p){
  if(p.category === "electrolyte"){
    const costPer1000Na = p.sodium ? (p.price / p.sodium) * 1000 : null;
    return {costPer1000Na};
  }
  const perGram   = p.price / p.carbs;
  const perHour   = TARGET_RATE / p.carbs;
  const costHour  = perHour * p.price;
  const gels300   = Math.ceil(MARATHON_G / p.carbs);
  const cost300   = gels300 * p.price;
  const sodiumHr  = p.sodium === null ? null : Math.round(perHour * p.sodium);
  return {perGram, perHour, costHour, gels300, cost300, sodiumHr};
}
PRODUCTS.forEach(p => Object.assign(p, derive(p)));

/* Gut comfort (gels only). Computed from ingredient count, min-max
   normalized against the gel field — fewer ingredients scores higher. This
   isn't a stand-in for someone actually testing the product; it's what the
   declared ingredient panel implies, same as every other number here. */
function ingredientGutScore(p){
  const gels = PRODUCTS.filter(x => x.category === "gel");
  const counts = gels.map(x => x.ingredients.split(",").length);
  const min = Math.min(...counts), max = Math.max(...counts);
  const mine = p.ingredients.split(",").length;
  const t = max === min ? 1 : (mine - min) / (max - min);
  return Math.round((1 - t) * 100);
}
PRODUCTS.forEach(p => { if(p.category === "gel") p.gut = ingredientGutScore(p); });

/* Overall score. Each category scores its own dimensions — gels and drinks
   share rate/density/sodium/cost, gels alone add gut tolerance (the only
   category where it's judged), electrolytes get a wholly different set
   built from their own fields. Every dimension is min-max normalized
   against that product's category peers rather than a fixed scale, so it
   self-adjusts as products are added instead of needing retuning. A
   product's score is the plain average of whichever dimensions it has a
   real value for — missing data is dropped, not counted against it. */
const SCORE_DIMS = {
  gel: [
    ["rate", "Absorption rate", p=>p.ratioScore, "hi"],
    ["dens", "Carb density", p=>p.carbs, "hi"],
    ["sod",  "Sodium", p=>p.sodium, "hi"],
    ["cost", "Value (cost/gram)", p=>p.perGram, "lo"],
    ["gut",  "Gut comfort", p=>p.gut, "hi"]
  ],
  drink: [
    ["rate", "Absorption rate", p=>p.ratioScore, "hi"],
    ["dens", "Carb density", p=>p.carbs, "hi"],
    ["sod",  "Sodium", p=>p.sodium, "hi"],
    ["cost", "Value (cost/gram)", p=>p.perGram, "lo"]
  ],
  electrolyte: [
    ["sod",  "Sodium dose", p=>p.sodium, "hi"],
    ["cost", "Value (cost/1000mg Na)", p=>p.costPer1000Na, "lo"],
    ["pot",  "Potassium", p=>p.potassium, "hi"],
    ["cal",  "Calcium", p=>p.calcium, "hi"],
    ["mag",  "Magnesium", p=>p.magnesium, "hi"]
  ]
};

/* Computes the overall score AND keeps the per-dimension breakdown that
   produced it — the score badge shows just the number, but the "Score
   breakdown" section on each product page shows its work, same reasoning
   as making gut comfort transparent rather than an unexplained figure. */
function computeScore(p){
  const peers = PRODUCTS.filter(x => x.category === p.category);
  const breakdown = [];
  SCORE_DIMS[p.category].forEach(([key,label,get,dir]) => {
    const mine = get(p);
    if(mine === null || mine === undefined) return;
    const vals = peers.map(get).filter(v => v !== null && v !== undefined);
    const min = Math.min(...vals), max = Math.max(...vals);
    const t = max === min ? 1 : (mine - min) / (max - min);
    breakdown.push({key, label, score: Math.round((dir === "hi" ? t : 1 - t) * 100)});
  });
  const overall = breakdown.length ? Math.round(breakdown.reduce((a,b)=>a+b.score,0) / breakdown.length) : null;
  return {overall, breakdown};
}
PRODUCTS.forEach(p => { const s = computeScore(p); p.overallScore = s.overall; p.scoreBreakdown = s.breakdown; });
function scoreTier(score){ return score >= 65 ? "best" : score >= 35 ? "mid" : "worst"; }
function scoreTierLabel(score){ return score >= 65 ? "Strong" : score >= 35 ? "Mixed" : "Weak"; }

function scoreCarb(p){ return Math.round(p.carbs / 45 * 100); }
function scoreCost(p){ return Math.max(5, Math.round(100 - (p.perGram - 0.05) / 0.11 * 90)); }
function scoreSodium(p){
  if(p.sodiumHr === null) return null;
  return Math.min(100, Math.round(p.sodiumHr / 700 * 100));
}

/* Capability set.
   get()  positions and ranks against the field  (an index, never shown)
   show() what the reader actually sees          (a real measured value)
   what   fixed definition of the measure, identical for every product
   note() one derived consequence of that value                        */
const CAPS = [
  {key:"rate", name:"Rate ceiling",
   what:"How much carbohydrate an hour the glucose-to-fructose blend can move.",
   get:p => p.ratioScore,
   show:p => p.ratio.replace(/\s/g,"").replace(":"," : "),
   legend:p => p.ratio.replace(/\s|~/g,""),
   note:p => p.ratioScore >= 90 ? "Above 90 g/hr." : "Around 60 to 75 g/hr."},

  {key:"dens", name:"Carbohydrate per sachet",
   what:"How much fuel one sachet carries, which sets how many you open.",
   get:p => scoreCarb(p),
   show:p => p.carbs + " g",
   legend:p => p.carbs + "g",
   note:p => `${p.perHour.toFixed(1)} sachets an hour to hold 90 g/hr.`},

  {key:"sod", name:"Sodium per sachet",
   what:"Sodium carried by the gel, against 400 to 1000 mg an hour typically lost.",
   get:p => scoreSodium(p),
   show:p => p.sodium === null ? null : p.sodium + " mg",
   legend:p => p.sodium === null ? "n/d" : p.sodium + "mg",
   note:p => p.sodiumHr === null ? "Not declared on the panel." : `${p.sodiumHr} mg an hour at 90 g/hr.`},

  {key:"cost", name:"Cost per gram",
   what:"Price of one gram of carbohydrate, the only unit that compares across sachet sizes.",
   get:p => scoreCost(p),
   show:p => "$" + p.perGram.toFixed(3),
   legend:p => "$" + p.perGram.toFixed(3),
   note:p => `${money(p.cost300)} to fuel a four-hour marathon.`},

  {key:"gut", name:"Gut tolerance",
   what:"Judged from the formulation. The only measure here we have not counted.",
   judged:true,
   get:p => p.gut,
   show:p => p.gut,
   legend:p => p.gut,
   note:p => `${p.ingredients.split(",").length} ingredients.`}
];

/* Rank among the field. Every capability is higher-is-better. */
function rank(cap, p){
  const vals = PRODUCTS.map(cap.get).filter(v => v !== null);
  const mine = cap.get(p);
  if(mine === null) return null;
  return {n: vals.filter(v => v > mine).length + 1, of: vals.length};
}
function field(cap){
  const vals = PRODUCTS.map(cap.get).filter(v => v !== null);
  return {min: Math.min(...vals), max: Math.max(...vals)};
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + n.toFixed(2);
const ord = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");

</script>
<script>
function prov(p){
  return p.ratioProv === "Stated" ? "" : " &middot; " + esc(p.ratioProv.toLowerCase());
}

/* The comparison set is fully user-controlled — any product, including the
   one being reviewed, can be removed or searched for and added back.
   Whenever the product being reviewed IS in the set, it's pinned as the
   leftmost column; removing it takes it out like any other product rather
   than forcing it back. Kept per-category so switching between Gels, Drink
   mixes and Electrolytes doesn't mix incompatible products into one table
   or clobber the comparison you built in another category. */
let compareIds = {
  gel: PRODUCTS.filter(p => p.category === "gel").slice(0,5).map(p => p.id),
  drink: PRODUCTS.filter(p => p.category === "drink").slice(0,5).map(p => p.id),
  electrolyte: PRODUCTS.filter(p => p.category === "electrolyte").slice(0,5).map(p => p.id)
};
let CURRENT = PRODUCTS[0];

function compareSet(cur){
  const ids = compareIds[cur.category].filter(id => PRODUCTS.some(p => p.id === id));
  const idx = ids.indexOf(cur.id);
  if(idx > 0){ ids.splice(idx, 1); ids.unshift(cur.id); }
  return ids.map(id => PRODUCTS.find(p => p.id === id));
}

function table(cur){
  const set = compareSet(cur);
  const unit = cur.servingWord || "sachet";
  /* 5th field is the definition. The numbers are useless to a reader who
     does not know what they measure. Electrolyte products get a different
     row set entirely — carbs aren't the point, sodium/potassium/calcium/
     magnesium are, so "cost per gram of carbohydrate" would be meaningless
     (often a divide-by-near-zero) for this category. */
  const rows = cur.category === "electrolyte" ? [
    ["Sodium", p=>`${p.sodium} mg`, p=>p.sodium, "hi",
     "The main electrolyte lost in sweat, and the biggest single driver of cramping and hyponatremia risk."],
    ["Potassium", p=>p.potassium==null?"not declared":`${p.potassium} mg`, p=>p.potassium, "hi",
     "Works alongside sodium in muscle and nerve function."],
    ["Calcium", p=>p.calcium==null?"not declared":`${p.calcium} mg`, p=>p.calcium, "hi",
     "Involved in muscle contraction; lost in far smaller amounts than sodium."],
    ["Magnesium", p=>p.magnesium==null?"not declared":`${p.magnesium} mg`, p=>p.magnesium, "hi",
     "Supports muscle and nerve function; some evidence it blunts cramping."],
    ["Carbohydrate", p=>`${p.carbs} g`, null, null,
     "Minimal by design. This is a hydration product, not a fuel source."],
    [`Price per ${unit}`, p=>money(p.price), p=>p.price, "lo",
     `What one ${unit} costs.`],
    ["Cost per 1000mg sodium", p=>p.costPer1000Na==null?"not declared":"$"+p.costPer1000Na.toFixed(2), p=>p.costPer1000Na, "lo",
     "The only price that compares across different sodium concentrations."]
  ] : [
    ["Carbohydrate", p=>`${p.carbs} g`, p=>p.carbs, "hi",
     `How much fuel one ${unit} carries.`],
    ["Glucose : fructose", p=>p.ratio, p=>p.ratioScore, "hi",
     "Governs how fast you absorb it. More fructose, higher ceiling."],
    ["Sodium", p=>p.sodium===null?"not declared":`${p.sodium} mg`, p=>p.sodium, "hi",
     "Against 400 to 1000 mg an hour typically lost in sweat."],
    ...(set.some(p => p.caffeine > 0)
        ? [["Caffeine", p=>`${p.caffeine} mg`, null, null,
            "A preference, not a quality, so it is not scored."]] : []),
    ["Provenance", p=>p.ratioProv, null, null,
     "Whether that ratio is read off the panel, computed from it, or inferred."],
    [`Price per ${unit}`, p=>money(p.price), p=>p.price, "lo",
     `What one costs. Not comparable across ${unit} sizes.`],
    ["Cost per gram", p=>"$"+p.perGram.toFixed(3), p=>p.perGram, "lo",
     `The only price that compares across ${unit} sizes.`],
    [`${unit[0].toUpperCase()+unit.slice(1)}s for 90 g/hr`, p=>p.perHour.toFixed(1), p=>p.perHour, "lo",
     `How many you open an hour to hold a 90 g/hr target.`]
  ];

  /* At the cap there's nothing to add, so the column simply isn't there —
     no button, no message, no dashed slot implying more room exists. */
  const atMax = set.length >= MAX_COMPARE;
  const addLabel = CATEGORY_LABEL[cur.category];
  const addCell = atMax ? "" : `<th class="addcol-cell">
       <div class="finder">
         <button class="add-trigger" id="addbtn"><span class="plus">+</span>Add ${esc(addLabel)}</button>
         <div class="fpanel" id="fpanel" hidden>
           <input id="fq" placeholder="Search the database" autocomplete="off">
           <div class="fres" id="fres"></div>
         </div>
       </div>
     </th>`;

  const head = `<tr><th>Measure</th>` + set.map(p =>
    `<th class="pcol${p.id===cur.id?' this':''}">
       <span class="thbrand">${esc(p.brand)}</span>
       <span class="thname">${esc(p.name)}</span>
       <button class="rm" data-rm="${p.id}" title="Remove from comparison"${set.length<=1?' disabled':''}>&times;</button>
     </th>`).join("") + addCell +
    `</tr>`;

  const body = rows.map(([l,fmt,key,dir,def]) => {
    let b=null,w=null;
    if(key){ const v=set.map(key).filter(x=>x!==null&&x!==undefined);
      if(v.length>1){ b = dir==="hi"?Math.max(...v):Math.min(...v); w = dir==="hi"?Math.min(...v):Math.max(...v);} }
    return `<tr><th><span class="rowlab">${l}</span><span class="rowdef">${esc(def)}</span></th>` + set.map(p=>{
      const v = key?key(p):null; let c = p.id===cur.id?"this":"";
      if(v!==null&&v!==undefined&&b!==null){ if(v===b)c+=" best"; else if(v===w)c+=" worst"; }
      return `<td${c?` class="${c.trim()}"`:""}>${fmt(p)}</td>`;
    }).join("") + (atMax ? "" : `<td class="addcol-cell"></td>`) + `</tr>`;
  }).join("");

  /* Fixed per-column widths (via colgroup, with table-layout:fixed) so each
     gel's column stays the same size whether it's one of two or one of five —
     removing or adding a column changes the table's total width, not how
     wide the surviving columns are. The trailing .addcol is a permanent
     empty column — the "+ Add" control lives there instead of floating
     beside the section heading, so adding a gel is always in the same
     place the columns themselves are. Omitted entirely once the comparison
     is at MAX_COMPARE — no slot, no option, nothing to click. */
  const cols = `<colgroup><col class="labelcol">${set.map(()=>'<col class="gelcol">').join("")}${atMax ? "" : '<col class="addcol">'}</colgroup>`;

  return `<div class="tw"><table>${cols}<thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

}

/* re-run after every render() since #page (and its section ids) are rebuilt from scratch */
let tocObserver = null;
function initTOC(p){
  const toc = document.getElementById("toc");
  document.getElementById("tocHead").textContent = p.name;
  if(tocObserver) tocObserver.disconnect();
  const links = [...toc.querySelectorAll("button")];
  const sections = links.map(a => document.getElementById(a.dataset.sec)).filter(Boolean);
  links.forEach((a,i) => a.classList.toggle("active", i===0));
  fitAnchorSpacer(sections);
  if(!sections.length) return;
  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const link = toc.querySelector(`button[data-sec="${entry.target.id}"]`);
      links.forEach(a => a.classList.remove("active"));
      link.classList.add("active");
    });
  }, {rootMargin: "-40% 0px -50% 0px", threshold: 0});
  sections.forEach(s => tocObserver.observe(s));
}

/* How far below a section's top edge we land, so its heading clears the
   sticky header instead of tucking underneath it. */
function headerOffset(){
  const bar = document.querySelector(".bar");
  return (bar ? bar.getBoundingClientRect().height : 52) + 12;
}

/* A section near the end of the page can be shorter than one viewport height,
   which caps how far the browser can scroll — jumping to its toc link then
   lands wherever that cap happens to be (often overlapping an earlier
   section) instead of at the target. Pad the bottom of the page by exactly
   the missing amount so every section can reach its resting scroll position. */
function fitAnchorSpacer(sections){
  const spacer = document.getElementById("tocSpacer");
  if(!spacer || !sections.length) return;
  spacer.style.height = "0px";
  const last = sections[sections.length - 1];
  const neededTop = last.getBoundingClientRect().top + window.scrollY - headerOffset();
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const deficit = neededTop - maxScroll;
  if(deficit > 0) spacer.style.height = Math.ceil(deficit) + "px";
}
window.addEventListener("resize", () => fitAnchorSpacer(
  [...document.getElementById("toc").querySelectorAll("button")]
    .map(a => document.getElementById(a.dataset.sec)).filter(Boolean)
));

/* Plain buttons, not <a href="#id">: native fragment-jump heuristics (used to
   avoid landing content under a sticky header) vary by engine and were
   landing inconsistently between adjacent sections even with preventDefault.
   A button has no default navigation to fight, so the scroll position is
   always exactly the one computed below. They also leave the URL alone, so
   the current #category/product-id permalink stays in the address bar. */
document.getElementById("toc").addEventListener("click", e => {
  const a = e.target.closest("button[data-sec]");
  if(!a) return;
  const el = document.getElementById(a.dataset.sec);
  if(!el) return;
  const targetTop = el.getBoundingClientRect().top + window.scrollY - headerOffset();
  window.scrollTo({top: Math.max(0, targetTop), behavior: "smooth"});
});

  document.querySelectorAll(".nav > .nv > a").forEach(a => a.classList.toggle("on", a.dataset.cat === p.category));

     the hash already matches (we were called FROM the router) so routing in
     never stacks a duplicate history entry. */
  const want = "#" + p.category + "/" + p.id;
  if(location.hash !== want){ try{ history.pushState(null, "", want); }catch(err){} }

/* Gel/drink/electrolyte finder: a short per-category quiz that scores
   products against the reader's answers using the same min-max-against-
   peers approach as overallScore, with weights driven by what was picked
   instead of a fixed dimension list. Each category gets its own question
   set — the gel questions don't all translate (drink mixes have no gut-
   comfort data and are all caffeine-free; electrolytes aren't a duration-
   scaled carb fuel at all) — but they share one mechanism and one visual
   language. Caffeine is a hard filter for gels (binary yes/no on the
   panel); everything else is a soft preference so an unusual combination
   of answers never produces zero results. */
const FINDER_CATS = [["gel","Gels"], ["drink","Drink Mixes"], ["electrolyte","Electrolytes"]];

const FINDER_QUESTIONS = {
  gel: [
    {key:"duration", label:"How long is the effort?", opts:[
      ["under90","Under 90 min"], ["90to3h","90 min – 3 hrs"], ["over3h","Over 3 hrs"]]},
    {key:"sensitivity", label:"Stomach sensitivity?", opts:[
      ["sensitive","Sensitive"], ["noissues","No issues"]]},
    {key:"caffeine", label:"Caffeine?", opts:[
      ["want","Want it"], ["avoid","Avoid it"], ["dontcare","Don't care"]]},
    {key:"electrolytes", label:"Do you want electrolytes in your gel?", opts:[
      ["yes","Yes"], ["no","No"], ["dontcare","Don't care"]]}
  ],
  drink: [
    {key:"duration", label:"How long is the effort?", opts:[
      ["under90","Under 90 min"], ["90to3h","90 min – 3 hrs"], ["over3h","Over 3 hrs"]]},
    {key:"carbs", label:"How many carbs do you want in your mix?", opts:[
      ["low","Low"], ["med","Medium"], ["high","High"]]},
    {key:"electrolytes", label:"Do you want electrolytes in your mix?", opts:[
      ["yes","Yes"], ["no","No"], ["dontcare","Don't care"]]}
  ],
  electrolyte: [
    {key:"sodium", label:"How much sodium are you looking for?", opts:[
      ["light","Light"], ["moderate","Moderate"], ["heavy","Heavy"]]},
    {key:"priority", label:"What matters more?", opts:[
      ["cost","Lowest cost"], ["profile","Fullest mineral profile"]]}
  ]
};

let finderAnswers = {category: "gel"};

function finderHasAnswer(){
  return Object.entries(finderAnswers).some(([k,v]) => k !== "category" && v);
}

function findMatches(answers){
  const cat = answers.category;
  const catPool = PRODUCTS.filter(p => p.category === cat);
  let pool = catPool;
  const dims = [];

  if(cat === "gel"){
    if(answers.caffeine === "want") pool = pool.filter(p => p.caffeine > 0);
    else if(answers.caffeine === "avoid") pool = pool.filter(p => p.caffeine === 0);
    if(!pool.length) pool = catPool;
    dims.push(["gut", p=>p.gut, "hi", answers.sensitivity === "sensitive" ? 3 : 1]);
    if(answers.electrolytes === "yes") dims.push(["sod", p=>p.sodium, "hi", 3]);
    else if(answers.electrolytes === "no") dims.push(["sod", p=>p.sodium, "lo", 2]);
    const durW = answers.duration === "over3h" ? 3 : answers.duration === "90to3h" ? 1.5 : 0.5;
    dims.push(["cost", p=>p.perGram, "lo", durW]);
    dims.push(["dens", p=>p.carbs, "hi", durW * 0.7]);
    dims.push(["rate", p=>p.ratioScore, "hi", 1]);
  } else if(cat === "drink"){
    if(answers.electrolytes === "yes") dims.push(["sod", p=>p.sodium, "hi", 3]);
    else if(answers.electrolytes === "no") dims.push(["sod", p=>p.sodium, "lo", 2]);
    const durW = answers.duration === "over3h" ? 3 : answers.duration === "90to3h" ? 1.5 : 0.5;
    dims.push(["cost", p=>p.perGram, "lo", durW]);
    if(answers.carbs === "low") dims.push(["dens", p=>p.carbs, "lo", 3]);
    else if(answers.carbs === "high") dims.push(["dens", p=>p.carbs, "hi", 3]);
    dims.push(["rate", p=>p.ratioScore, "hi", 1]);
  } else {
    if(answers.sodium === "light") dims.push(["sod", p=>p.sodium, "lo", 3]);
    else if(answers.sodium === "heavy") dims.push(["sod", p=>p.sodium, "hi", 3]);
    const costW = answers.priority === "cost" ? 4 : 1;
    const profileW = answers.priority === "profile" ? 3 : 1;
    dims.push(["cost", p=>p.costPer1000Na, "lo", costW]);
    dims.push(["pot", p=>p.potassium, "hi", profileW]);
    dims.push(["cal", p=>p.calcium, "hi", profileW]);
    dims.push(["mag", p=>p.magnesium, "hi", profileW]);
  }

  const scored = pool.map(p => {
    let total = 0, wsum = 0;
    dims.forEach(([,get,dir,w]) => {
      const mine = get(p);
      if(mine === null || mine === undefined) return;
      const vals = pool.map(get).filter(v => v !== null && v !== undefined);
      const min = Math.min(...vals), max = Math.max(...vals);
      const t = max === min ? 1 : (mine - min) / (max - min);
      total += (dir === "hi" ? t : 1 - t) * w;
      wsum += w;
    });
    return {p, matchScore: wsum ? total / wsum : 0};
  });
  scored.sort((a,b) => b.matchScore - a.matchScore || (b.p.overallScore ?? 0) - (a.p.overallScore ?? 0));
  return scored.slice(0, 3);
}

}

/* Race fueling calculator. Two inputs — carb tolerance (mapped to a target
   g/hr rate, since most readers don't know their own number) and effort
   duration — give a total carb target, then every gel and drink mix in the
   catalog is priced against that target so it's directly comparable to the
   existing product tables rather than a new interaction pattern. */
const CALC_TOLERANCE = [
  ["new", "New to this", 45],
  ["some", "Some experience", 75],
  ["experienced", "Very experienced", 105]
];
const CALC_HOURS = [...Array(16).keys()];       // 0–15 hr
const CALC_MINS = [0, 15, 30, 45];
let calcAnswers = {tolerance: "some", hours: 3, minutes: 0, category: "gel"};

function calcTargetRate(){
  const t = CALC_TOLERANCE.find(t => t[0] === calcAnswers.tolerance);
  return t ? t[2] : CALC_TOLERANCE[1][2];
}
function calcTotalCarbs(){
  const hours = Number(calcAnswers.hours) + Number(calcAnswers.minutes) / 60;
  return hours > 0 ? Math.round(calcTargetRate() * hours) : 0;
}

function calcResultsHTML(){
  const total = calcTotalCarbs();
  const rows = PRODUCTS.filter(p => p.category === calcAnswers.category).map(p => {
    const unit = p.servingWord || "sachet";
    const count = total > 0 ? Math.ceil(total / p.carbs) : 0;
    return {p, unit, count, cost: count * p.price};
  }).sort((a,b) => a.cost - b.cost);

  return `
  <div class="pcell calc-total">
    <div class="k">Carbohydrate needed for this effort</div>
    <div class="v num">${total}<small>g</small></div>
  </div>
  <div class="fq-opts calc-fueltype">
    <button type="button" class="fq-opt${calcAnswers.category==="gel"?" on":""}" data-cf="category" data-cv="gel">Gels</button>
    <button type="button" class="fq-opt${calcAnswers.category==="drink"?" on":""}" data-cf="category" data-cv="drink">Isotonic drinks</button>
  </div>
  <div class="tw calc-tw"><table>
    <colgroup><col class="labelcol"><col class="gelcol"><col class="gelcol"></colgroup>
    <thead><tr><th>Product</th><th>You'll need</th><th>Total cost</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <th><button class="home-go calc-link" data-i="${PRODUCTS.indexOf(r.p)}">${esc(r.p.name)}</button></th>
        <td>${total > 0 ? `${r.count} ${esc(r.unit)}${r.count === 1 ? "" : "s"}` : "—"}</td>
        <td>${total > 0 ? money(r.cost) : "—"}</td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

  document.title = "Race Fueling Calculator — Fuel Finder";

      <div class="fq-group">

        <div class="fq-opts">${CALC_TOLERANCE.map(([v,l]) => `
          <button type="button" class="fq-opt${calcAnswers.tolerance===v?" on":""}" data-cf="tolerance" data-cv="${v}">${esc(l)}</button>`).join("")}</div>

          <select id="calcMinsSel" class="calc-select">${CALC_MINS.map(m => `
            <option value="${m}"${calcAnswers.minutes===m?" selected":""}>${m} min</option>`).join("")}</select>

      </div>

  </section>

  window.scrollTo(0,0);
}

/* Shown when a search doesn't match anything in the catalog — a clean
   dead end instead of no result at all, and a natural place to point
   people at what already exists while a new review gets written. */
function renderWaiting(query){
  RequestLog.save(query);
  document.title = query + " — not reviewed yet — Fuel Finder";
  clearNavHighlights();
  document.getElementById("toc").style.display = "none";
  document.getElementById("page").innerHTML = `
  <div class="home-hero">
    <p class="eye">Not reviewed yet</p>
    <h1>${esc(query)}</h1>
    <p class="thesis">We hold every review to the same bar: checked against the declared nutrition panel, no marketing copy taken at face value. That takes a bit of time, so this one isn't live yet &mdash; but it's on the list.</p>
  </div>
  ${categoryCardsHTML()}`;
  window.scrollTo(0,0);
}

function drawSiteSearch(q){
  const box = document.getElementById("siteSearchResults");
  if(!box) return;
  const s = q.trim().toLowerCase();
  if(!s){ box.innerHTML = ""; return; }
  const hits = PRODUCTS.filter(p =>
    (p.name + " " + p.brand + " " + p.code).toLowerCase().includes(s)).slice(0, 8);
  box.innerHTML = hits.length
    ? hits.map(p => `<button data-i="${PRODUCTS.indexOf(p)}">${esc(p.name)}<span>${esc(p.brand)} &middot; ${CATEGORY_LABEL[p.category]}</span></button>`).join("")
    : `<p>No review of &ldquo;${esc(q.trim())}&rdquo; yet.<br>
         <button class="request-btn" data-request="${esc(q.trim())}">Request this one &rarr;</button></p>`;
}

/* Owner-only view of what RequestLog has collected — not linked from the
   nav, reached by putting #requests on the URL. Password-gated so a casual
   visitor who finds the URL doesn't see it, but this is a client-only site
   with no server: the password check runs in JS anyone can read, so this
   is a deterrent, not real security. */
const ADMIN_UNLOCK_KEY = "fuelfinder_admin_unlocked";
const ADMIN_PASSWORD = "Fuel";

function renderAdminGate(){
  document.title = "Owner view — Fuel Finder";
  clearNavHighlights();
  document.getElementById("toc").style.display = "none";
  document.getElementById("page").innerHTML = `
  <div class="home-hero">
    <p class="eye">Owner view</p>
    <h1>Requested reviews</h1>
    <p class="thesis">This page is password protected.</p>
    <div class="admin-gate">
      <input type="password" id="adminPass" placeholder="Password" autocomplete="off">
      <button type="button" class="home-go" id="adminUnlock">Unlock</button>
      <p class="admin-gate-err" id="adminGateErr" hidden>Incorrect password.</p>
    </div>
  </div>`;
  window.scrollTo(0,0);
  document.getElementById("adminPass").focus();
}

function checkAdminPassword(){
  const input = document.getElementById("adminPass");
  if(input.value === ADMIN_PASSWORD){
    localStorage.setItem(ADMIN_UNLOCK_KEY, "1");
    renderRequestsAdmin();
  } else {
    document.getElementById("adminGateErr").hidden = false;
    input.value = "";
    input.focus();
  }
}

function renderRequestsAdmin(){
  if(localStorage.getItem(ADMIN_UNLOCK_KEY) !== "1"){ renderAdminGate(); return; }
  document.title = "Requested reviews — Fuel Finder";
  clearNavHighlights();
  document.getElementById("toc").style.display = "none";
  const entries = RequestLog.list();
  document.getElementById("page").innerHTML = `
  <div class="home-hero">
    <p class="eye">Owner view</p>
    <h1>Requested reviews</h1>
    <p class="thesis">Searches that didn't match anything in the catalog, saved in this browser. ${entries.length ? `${entries.length} distinct ${entries.length===1?"request":"requests"}.` : "Nothing logged yet."}</p>
  </div>
  ${entries.length ? `
  <table class="req-table">
    <thead><tr><th>Query</th><th>Times searched</th><th>Last seen</th><th></th></tr></thead>
    <tbody>${entries.map(r => `<tr>
      <td>${esc(r.query)}</td>
      <td class="num">${r.count}</td>
      <td>${new Date(r.lastSeen).toLocaleDateString()}</td>
      <td><button class="req-remove" data-remove-request="${esc(r.query)}">Clear</button></td>
    </tr>`).join("")}</tbody>
  </table>
  <button class="req-clear-all" id="clearAllRequests">Clear all</button>` : ""}`;
  window.scrollTo(0,0);
}

/* Hash routing. #category/product-id is a review permalink, #requests is the
   owner view, and anything else — including no hash — is the landing page.
   select() pushes permalinks; Back/Forward arrive here via hashchange. */
function routeFromHash(){
  const h = location.hash.slice(1);
  if(h === "requests"){ renderRequestsAdmin(); return; }
  if(h === "find"){ renderFinder(); return; }
  const fm = h.match(/^find\/([a-z]+)$/);
  if(fm){ renderFinder(fm[1]); return; }
  if(h === "calculator"){ renderCalculator(); return; }
  const m = h.match(/^([a-z]+)\/(.+)$/);
  if(m){
    const p = PRODUCTS.find(x => x.category === m[1] && x.id === m[2]);
    if(p){ select(PRODUCTS.indexOf(p)); return; }
  }
  renderHome();
}
window.addEventListener("hashchange", routeFromHash);

document.getElementById("home-link").addEventListener("click", e => {
  e.preventDefault();
  closeMenu();
  /* push, not replace: Back from the landing page returns to the review */
  try{ history.pushState(null, "", location.pathname); }catch(err){}
  renderHome();
});

routeFromHash();
</script>
